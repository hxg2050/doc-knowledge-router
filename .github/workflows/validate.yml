name: Validate Skills

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/validate-skills.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python skills/roguelike-design-advisor/scripts/query_library.py --check
      - run: python -m pip install "Pillow>=9.1"
      - run: python -B -m unittest discover -s skills/game-ui-asset-workflow/scripts
